apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqldb
  namespace: crypto-exam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysqldb
  template:
    metadata:
      labels:
        app: mysqldb
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
---
apiVersion: v1
kind: Service
metadata:
  name: mysqldb
  namespace: crypto-exam
spec:
  type: ClusterIP
  selector:
    app: mysqldb
  ports:
    - port: 3306
      targetPort: 3306
